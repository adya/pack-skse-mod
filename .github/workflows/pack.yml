name: Pack

on:
  workflow_call:
    inputs:
      CMAKE_LISTS_PATH:
        type: string
        description: "Path to the CMakeLists.txt holding the project's VERSION cache variable. Relative to repository root. Use a nested path (e.g. 'SPID/CMakeLists.txt') when the project isn't at the repo root."
        required: false
        default: 'CMakeLists.txt'
      VCPKG_JSON_PATH:
        type: string
        description: "Path to the vcpkg.json holding the project's version-string, rewritten by the tag-driven version bump. Relative to repository root. In a multi-project repo this can differ from VCPKG_MANIFEST_PATH - see that input."
        required: false
        default: 'vcpkg.json'
      VCPKG_MANIFEST_PATH:
        type: string
        description: "vcpkg manifest glob used to install dependencies for the build. Independent of VCPKG_JSON_PATH: in a multi-project repo (e.g. one root vcpkg.json aggregating dependencies for several CMake subprojects) the file driving the actual build isn't necessarily the same one that carries the product's own version-string."
        required: false
        default: 'vcpkg.json'
      AUTO_VERSION_BUMP:
        type: boolean
        description: "Whether to rewrite CMAKE_LISTS_PATH/VCPKG_JSON_PATH's version fields to match the pushed tag (and force-move the tag onto that commit) before building. Set to false to build/publish using whatever version is already committed."
        required: false
        default: true
      CMAKE_PROJECT_DIR:
        type: string
        description: "Path to the built project's output directory, relative to the CMake binary dir (e.g. 'SPID' if the DLL lands at build/SPID/Release/x.dll). Leave blank if the project builds straight into the binary dir."
        required: false
        default: ''
      CMAKE_CONFIG_PRESET:
        type: string
        description: "Name of the CMakePresets.json configure preset to use. CommonLibSSE-NG builds every enabled edition (SE/AE/VR) from this one preset - there's no per-edition preset anymore."
        required: false
        default: 'vs2026-windows-vcpkg'
      CMAKE_BUILD_PRESET:
        type: string
        description: "Name of the CMakePresets.json build preset to use. Leave blank to build CMAKE_BINARY_DIR directly with CMAKE_BUILD_CONFIGURATION instead."
        required: false
        default: ''
      CMAKE_BUILD_CONFIGURATION:
        type: string
        description: "Configuration the project is built in. Needed even when a build preset is given, since it's also used to locate build output."
        required: false
        default: 'Release'
      CMAKE_BINARY_DIR:
        type: string
        description: "Directory where CMake outputs build files."
        required: false
        default: 'build'
      CMAKE_BINARY_NAME:
        type: string
        description: "Name of the built binary. Takes precedence over CMAKE_BINARY_NAME_VAR when set."
        required: false
        default: ''
      CMAKE_BINARY_NAME_VAR:
        type: string
        description: "Name of the CMake CACHE variable holding the built binary's name."
        required: false
        default: 'NAME'
      CMAKE_BINARY_VERSION:
        type: string
        description: "Version of the built binary. Takes precedence over CMAKE_BINARY_VERSION_VAR when set."
        required: false
        default: ''
      CMAKE_BINARY_VERSION_VAR:
        type: string
        description: "Name of the CMake CACHE variable holding the built binary's version."
        required: false
        default: 'VERSION'
      INCLUDE_PDB:
        type: boolean
        description: "Whether to include the PDB file alongside the DLL in the published package."
        required: false
        default: true
      REQUIRED_INSTALLATION_DIR:
        type: string
        description: "Path to a directory (relative to repository root) whose contents should always ship alongside the DLL (e.g. INI configs, readmes). Its own internal layout must already be Data-folder-relative - it's copied as-is into the package root."
        required: false
        default: 'Required Files'
      PLUGINS_PATH:
        type: string
        description: "Path inside the package where the built DLL/PDB are installed. Typically 'SKSE/Plugins'."
        required: false
        default: 'SKSE/Plugins'
      PUBLISH_ARCHIVE_TYPE:
        type: string
        description: "Archive format for the published release asset. Supports 'zip' or '7z'."
        required: false
        default: '7z'
      MOD_NAME:
        type: string
        description: "Display name used for the release name."
        required: true
    secrets:
      GIT_SSH_KEY:
        description: "Public part of the Deploy Key used to checkout the repository or any submodules that use SSH."
        required: false
    outputs:
      PRODUCT_NAME:
        value: ${{ jobs.build.outputs.PRODUCT_NAME }}
      PRODUCT_VERSION:
        value: ${{ jobs.build.outputs.PRODUCT_VERSION }}
      PACKAGE_NAME:
        value: ${{ jobs.build.outputs.PACKAGE_NAME }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      moved: ${{ steps.bump.outputs.moved || 'false' }}
    steps:
      - uses: actions/checkout@v4
        if: inputs.AUTO_VERSION_BUMP
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Verify tag points at branch tip
        if: inputs.AUTO_VERSION_BUMP
        run: |
          BRANCH_SHA=$(git rev-parse HEAD)
          if [ "$BRANCH_SHA" != "${{ github.sha }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not point at the tip of ${{ github.event.repository.default_branch }} ($BRANCH_SHA). Re-tag its tip and push again."
            exit 1
          fi

      - name: Bump version files and move tag
        id: bump
        if: inputs.AUTO_VERSION_BUMP
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          sed -i -E "s/set\(VERSION [0-9]+\.[0-9]+\.[0-9]+/set(VERSION $VERSION/" "${{ inputs.CMAKE_LISTS_PATH }}"
          sed -i -E "s/\"version-string\": \"[0-9]+\.[0-9]+\.[0-9]+\"/\"version-string\": \"$VERSION\"/" "${{ inputs.VCPKG_JSON_PATH }}"

          if git diff --quiet; then
            echo "Version files already match tag $VERSION; nothing to do."
            echo "moved=false" >> $GITHUB_OUTPUT
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${{ inputs.CMAKE_LISTS_PATH }}" "${{ inputs.VCPKG_JSON_PATH }}"
            git commit -m "Set version to $VERSION"
            git push origin HEAD:${{ github.event.repository.default_branch }}
            git tag -f "${{ github.ref_name }}"
            git push origin "refs/tags/${{ github.ref_name }}" --force
            echo "moved=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: version
    if: needs.version.outputs.moved == 'false'
    runs-on: windows-latest
    outputs:
      PRODUCT_NAME: ${{ steps.export.outputs.PRODUCT_NAME }}
      PRODUCT_VERSION: ${{ steps.export.outputs.PRODUCT_VERSION }}
      PACKAGE_NAME: ${{ steps.export.outputs.PACKAGE_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.GIT_SSH_KEY }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: '${{ inputs.VCPKG_MANIFEST_PATH }}'

      - name: Configure CMake
        shell: pwsh
        run: cmake --preset ${{ inputs.CMAKE_CONFIG_PRESET }}

      - name: Build (via build preset)
        if: inputs.CMAKE_BUILD_PRESET != ''
        shell: pwsh
        run: cmake --build --preset ${{ inputs.CMAKE_BUILD_PRESET }}

      - name: Build (via binary dir)
        if: inputs.CMAKE_BUILD_PRESET == ''
        shell: pwsh
        run: cmake --build ${{ inputs.CMAKE_BINARY_DIR }} --config ${{ inputs.CMAKE_BUILD_CONFIGURATION }}

      - id: export
        shell: pwsh
        run: |
          $PRODUCT_NAME = If (![string]::IsNullOrEmpty("${{ inputs.CMAKE_BINARY_NAME }}")) { "${{ inputs.CMAKE_BINARY_NAME }}" } Else { cmake -L -N ${{ inputs.CMAKE_BINARY_DIR }} | grep "^${{ inputs.CMAKE_BINARY_NAME_VAR }}:STRING=" | %{$_ -replace "${{ inputs.CMAKE_BINARY_NAME_VAR }}:STRING=",""} }
          $PRODUCT_VERSION = If (![string]::IsNullOrEmpty("${{ inputs.CMAKE_BINARY_VERSION }}")) { "${{ inputs.CMAKE_BINARY_VERSION }}" } Else { cmake -L -N ${{ inputs.CMAKE_BINARY_DIR }} | grep "^${{ inputs.CMAKE_BINARY_VERSION_VAR }}:STRING=" | %{$_ -replace "${{ inputs.CMAKE_BINARY_VERSION_VAR }}:STRING=",""} }

          $PROJECT_DIR = "${{ inputs.CMAKE_PROJECT_DIR }}"
          $PRODUCTS_DIR = If ([string]::IsNullOrEmpty($PROJECT_DIR)) { "${{ inputs.CMAKE_BINARY_DIR }}/${{ inputs.CMAKE_BUILD_CONFIGURATION }}" } Else { "${{ inputs.CMAKE_BINARY_DIR }}/$PROJECT_DIR/${{ inputs.CMAKE_BUILD_CONFIGURATION }}" }

          $PACKAGE_NAME = "$PRODUCT_NAME-${{ github.ref_name }}"
          $PACKAGE_DIR = "package"
          $PLUGIN_DIR = "$PACKAGE_DIR/${{ inputs.PLUGINS_PATH }}"

          New-Item -ItemType Directory -Force -Path $PLUGIN_DIR | Out-Null
          Copy-Item "$PRODUCTS_DIR/$PRODUCT_NAME.dll" $PLUGIN_DIR
          If ('${{ inputs.INCLUDE_PDB }}' -eq 'true') {
            Copy-Item "$PRODUCTS_DIR/$PRODUCT_NAME.pdb" $PLUGIN_DIR
          }

          $REQUIRED_DIR = "${{ inputs.REQUIRED_INSTALLATION_DIR }}"
          If (![string]::IsNullOrEmpty($REQUIRED_DIR) -and (Test-Path "$REQUIRED_DIR/*")) {
            Copy-Item "$REQUIRED_DIR/*" $PACKAGE_DIR -Recurse -Force
          }

          echo "PRODUCT_NAME=$PRODUCT_NAME" >> $Env:GITHUB_OUTPUT
          echo "PRODUCT_VERSION=$PRODUCT_VERSION" >> $Env:GITHUB_OUTPUT
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $Env:GITHUB_OUTPUT
          echo "PACKAGE_DIR=$PACKAGE_DIR" >> $Env:GITHUB_OUTPUT
          echo "Built $PRODUCT_NAME.dll ($PRODUCT_VERSION) [OK]"
          echo "Location: $PRODUCTS_DIR"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.export.outputs.PACKAGE_NAME }}
          if-no-files-found: error
          path: ${{ steps.export.outputs.PACKAGE_DIR }}

  publish:
    needs: build
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/publish.yml
    with:
      INSTALLER_NAME: ${{ needs.build.outputs.PACKAGE_NAME }}
      ARCHIVE_TYPE: ${{ inputs.PUBLISH_ARCHIVE_TYPE }}
      MOD_NAME: ${{ inputs.MOD_NAME }}
      MOD_VERSION: ${{ needs.build.outputs.PRODUCT_VERSION }}
