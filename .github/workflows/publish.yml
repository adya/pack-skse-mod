name: Publish Mod

on:
  workflow_call:
    inputs:
      INSTALLER_NAME:
        type: string
        required: true
      ARCHIVE_TYPE:
        type: string
        required: true
      MOD_NAME:
        type: string
        required: true
      MOD_VERSION:
        type: string
        required: true
jobs:
  github:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: ${{inputs.INSTALLER_NAME}}
        path: ${{inputs.INSTALLER_NAME}}

    - name: Zip Installer
      if: inputs.ARCHIVE_TYPE == 'zip'
      shell: pwsh
      run: Compress-Archive -Path "${{inputs.INSTALLER_NAME}}" -DestinationPath "${{inputs.INSTALLER_NAME}}.zip"

    - name: 7z Installer
      if: inputs.ARCHIVE_TYPE == '7z'
      shell: pwsh
      run: 7z a -t7z -mx=9 "${{inputs.INSTALLER_NAME}}.7z" "${{inputs.INSTALLER_NAME}}" -r

    - name: Set Release Name
      id: release
      shell: pwsh
      run: |
        $RELEASE_NAME = "${{ inputs.MOD_NAME }} ${{ inputs.MOD_VERSION }}".Trim()
        echo "RELEASE_NAME=$RELEASE_NAME" >> $Env:GITHUB_OUTPUT

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: "${{ steps.release.outputs.RELEASE_NAME }}"
        files: "${{ inputs.INSTALLER_NAME }}.${{inputs.ARCHIVE_TYPE}}"
        prerelease: ${{ contains(github.ref_name, 'rc') }}
        generate_release_notes: true
